<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./viz.css">
<style>
html,body{margin:0;padding:0;background:#f4efe4;height:100%;overflow:hidden;}
a{color:#a8853a;text-decoration:none;} a:hover{color:#8a6c2c;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes drift1{0%,100%{transform:translate(-10%,-6%) scale(1);}33%{transform:translate(14%,10%) scale(1.25);}66%{transform:translate(-4%,18%) scale(.9);}}
@keyframes drift2{0%,100%{transform:translate(8%,12%) scale(1.1);}50%{transform:translate(-16%,-10%) scale(.85);}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);}40%{transform:translate(-12%,14%) scale(1.3);}75%{transform:translate(16%,-8%) scale(.95);}}
.viz-big .viz{height:150px;width:280px;margin-bottom:0;transform:scale(2.3);transform-origin:center;position:relative;}
.viz-big{min-height:340px;}
@media (max-height:760px){.viz-big .viz{transform:scale(1.7);}.viz-big{min-height:250px;}}
@media (max-height:620px){
.viz-big .viz{transform:scale(1.05);}
.viz-big{min-height:145px;margin:0 !important;}
.principle-col{padding-top:14px !important;padding-bottom:14px !important;}
.principle-col h1{margin-top:10px !important;font-size:clamp(30px,4.5vw,44px) !important;}
.principle-col p{margin-top:10px !important;font-size:16px !important;line-height:1.55 !important;}
}
</style>
</helmet>
<div style="position:fixed;inset:0;background:#f4efe4;color:#332b1e;font-family:'Nunito',sans-serif;display:flex;flex-direction:column;overflow:hidden;">
  <div style="position:absolute;inset:-20%;pointer-events:none;filter:blur(70px);opacity:.5;">
    <div style="position:absolute;top:5%;left:8%;width:45vw;height:45vw;border-radius:50%;background:radial-gradient(circle,#c96f5e,transparent 65%);animation:drift1 26s ease-in-out infinite;"></div>
    <div style="position:absolute;top:40%;right:5%;width:40vw;height:40vw;border-radius:50%;background:radial-gradient(circle,#5e8fc9,transparent 65%);animation:drift2 32s ease-in-out infinite;"></div>
    <div style="position:absolute;bottom:0;left:30%;width:42vw;height:42vw;border-radius:50%;background:radial-gradient(circle,#6faf74,transparent 65%);animation:drift3 29s ease-in-out infinite;"></div>
    <div style="position:absolute;top:15%;right:30%;width:34vw;height:34vw;border-radius:50%;background:radial-gradient(circle,#9a7ec9,transparent 65%);animation:drift1 38s ease-in-out infinite reverse;"></div>
    <div style="position:absolute;bottom:10%;left:5%;width:32vw;height:32vw;border-radius:50%;background:radial-gradient(circle,#d4a843,transparent 65%);animation:drift2 24s ease-in-out infinite reverse;"></div>
  </div>
  <sc-if value="{{ loaded }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ startEdit }}" style="position:absolute;top:18px;right:20px;z-index:5;background:rgba(255,255,255,0.65);border:1px solid rgba(51,43,30,0.15);color:#6e634e;width:46px;height:46px;border-radius:50%;font-size:18px;cursor:pointer;transition:all .25s;backdrop-filter:blur(6px);" style-hover="border-color:#a8853a;color:#a8853a;transform:scale(1.06);" title="Rewrite this in my own words">✎</button>
    <div style="position:relative;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;">
    <div key="{{ cardKey }}" class="principle-col" style="margin:auto;display:flex;flex-direction:column;align-items:center;padding:32px clamp(20px,7vw,110px);text-align:center;animation:fadeUp .7s cubic-bezier(.22,.9,.3,1) both;">
      <div style="font-size:13px;letter-spacing:0.28em;text-transform:uppercase;color:#a8853a;font-weight:700;font-family:'Baloo 2',sans-serif;">{{ book }}</div>
      <div style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#93876c;margin-top:6px;font-weight:600;">{{ sectionNum }} · {{ section }}</div>
      <div class="card viz-big" style="position:relative;margin:0;display:flex;align-items:center;justify-content:center;">
        {{ vizEl }}
      </div>
      <sc-if value="{{ notEditing }}" hint-placeholder-val="{{ true }}">
        <h1 style="margin:22px 0 0;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:clamp(38px,5vw,64px);line-height:1.08;color:#2a2214;text-wrap:balance;max-width:18ch;">{{ title }}</h1>
        <p style="margin:22px 0 0;font-size:clamp(18px,1.7vw,23px);line-height:1.7;color:#544936;max-width:60ch;text-wrap:pretty;font-weight:500;">{{ body }}</p>
      </sc-if>
      <sc-if value="{{ editing }}" hint-placeholder-val="{{ false }}">
        <input value="{{ draftTitle }}" onChange="{{ onTitleChange }}" style="margin:22px 0 0;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:clamp(30px,4vw,52px);line-height:1.1;color:#2a2214;text-align:center;background:rgba(255,255,255,0.65);border:2px dashed rgba(168,133,58,0.5);border-radius:14px;padding:8px 18px;width:min(700px,86vw);outline:none;" />
        <textarea value="{{ draftBody }}" onChange="{{ onBodyChange }}" rows="6" style="margin:18px 0 0;font-family:'Nunito',sans-serif;font-size:clamp(17px,1.5vw,20px);line-height:1.65;color:#544936;text-align:center;background:rgba(255,255,255,0.65);border:2px dashed rgba(168,133,58,0.5);border-radius:14px;padding:14px 18px;width:min(760px,86vw);outline:none;resize:vertical;font-weight:500;"></textarea>
        <div style="display:flex;gap:12px;margin-top:16px;font-family:'Baloo 2',sans-serif;">
          <button onClick="{{ saveEdit }}" style="background:#2b7a31;border:none;color:#fff;padding:10px 26px;border-radius:24px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px -6px rgba(43,122,49,0.5);" style-hover="background:#256a2b;">✓ Save — this is my voice</button>
          <button onClick="{{ cancelEdit }}" style="background:rgba(255,255,255,0.7);border:1px solid rgba(51,43,30,0.2);color:#6e634e;padding:10px 22px;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;" style-hover="border-color:#a8853a;color:#a8853a;">Cancel</button>
          <sc-if value="{{ hasCustomEdit }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ resetEdit }}" style="background:none;border:none;color:#93876c;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:underline;" title="Restore the original text">restore original</button>
          </sc-if>
        </div>
      </sc-if>
    </div>
    </div>
    <div style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,48px) 26px;">
      <button onClick="{{ goBack }}" style="background:rgba(255,255,255,0.6);border:1px solid rgba(51,43,30,0.15);color:#93876c;width:52px;height:52px;border-radius:50%;font-size:19px;cursor:pointer;transition:all .25s;backdrop-filter:blur(6px);" style-hover="border-color:#a8853a;color:#a8853a;" title="Back (←)">←</button>
      <sc-if value="{{ showProgress }}" hint-placeholder-val="{{ true }}">
        <div style="text-align:center;">
          <div style="font-size:12px;letter-spacing:0.16em;color:#93876c;font-weight:700;font-family:'Baloo 2',sans-serif;">{{ seenCount }} OF {{ total }} DRAWN</div>
          <div style="width:180px;height:3px;background:rgba(51,43,30,0.1);border-radius:2px;margin:8px auto 0;overflow:hidden;"><div style="height:100%;background:linear-gradient(90deg,#c96f5e,#d4a843,#6faf74,#5e8fc9);border-radius:2px;transition:width .6s;width:{{ progressPct }};"></div></div>
        </div>
      </sc-if>
      <button onClick="{{ goNext }}" style="background:#2a2214;border:1px solid #2a2214;color:#e8c87a;width:52px;height:52px;border-radius:50%;font-size:19px;cursor:pointer;transition:all .25s;box-shadow:0 8px 20px -6px rgba(42,34,20,0.5);" style-hover="transform:scale(1.08);background:#3a2f1c;" title="Random next (→)">→</button>
    </div>
  </sc-if>
  <template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#f4efe4"></rect><circle cx="50" cy="44" r="16" fill="none" stroke="#a8853a" stroke-width="3"></circle><circle cx="50" cy="44" r="5" fill="#a8853a"></circle><text x="50" y="82" font-family="sans-serif" font-size="10" fill="#544936" text-anchor="middle">108</text></svg></template>
  <sc-if value="{{ notLoaded }}" hint-placeholder-val="{{ true }}">
    <div style="position:relative;flex:1;display:flex;align-items:center;justify-content:center;color:#93876c;font-style:italic;font-size:20px;">gathering the principles…</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showProgress&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;}}">
class Component extends DCLogic {
  state = { data: null, idx: null, bag: [], pos: -1, history: [], histPtr: -1, editing: false, draftTitle: '', draftBody: '', edits: {} };
  KEY = 'principles-random-bag-v1';
  EDITKEY = 'principles-edits-v1';
  componentDidMount() {
    fetch('./principles.json').then(r => r.json()).then(data => {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(this.KEY)); } catch(e) {}
      let bag, pos;
      if (saved && Array.isArray(saved.bag) && saved.bag.length === data.length) {
        bag = saved.bag; pos = saved.pos;
      } else {
        bag = this.shuffle([...Array(data.length).keys()]); pos = 0;
      }
      if (pos < 0 || pos >= bag.length) pos = 0;
      let edits = {};
      try { edits = JSON.parse(localStorage.getItem(this.EDITKEY)) || {}; } catch(e) {}
      this.setState({ data, bag, pos, idx: bag[pos], history: [bag[pos]], histPtr: 0, edits });
    });
    this._keyHandler = (e) => {
      if (this.state.editing) return;
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); this.next(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); this.back(); }
    };
    window.addEventListener('keydown', this._keyHandler);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._keyHandler); }
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  persist(bag, pos) { try { localStorage.setItem(this.KEY, JSON.stringify({ bag, pos })); } catch(e) {} }
  next() {
    const s = this.state; if (!s.data) return;
    if (s.histPtr < s.history.length - 1) {
      const p = s.histPtr + 1;
      this.setState({ histPtr: p, idx: s.history[p] });
      return;
    }
    let { bag, pos } = s;
    pos += 1;
    if (pos >= bag.length) { bag = this.shuffle([...Array(s.data.length).keys()]); pos = 0; }
    const idx = bag[pos];
    const history = [...s.history, idx];
    this.persist(bag, pos);
    this.setState({ bag, pos, idx, history, histPtr: history.length - 1 });
  }
  back() {
    const s = this.state;
    if (s.histPtr > 0) this.setState({ histPtr: s.histPtr - 1, idx: s.history[s.histPtr - 1] });
  }
  renderVals() {
    const s = this.state;
    const showProgress = this.props.showProgress ?? true;
    if (!s.data || s.idx == null) return { loaded: false, notLoaded: true, showProgress };
    const p = s.data[s.idx];
    const edit = s.edits[s.idx];
    return {
      loaded: true, notLoaded: false, showProgress,
      cardKey: String(s.idx),
      book: p.book, sectionNum: p.sectionNum, section: p.section,
      title: edit ? edit.title : p.title, body: edit ? edit.body : p.body,
      editing: s.editing, notEditing: !s.editing,
      draftTitle: s.draftTitle, draftBody: s.draftBody,
      hasCustomEdit: !!edit,
      startEdit: () => this.setState({ editing: true, draftTitle: edit ? edit.title : p.title, draftBody: edit ? edit.body : p.body }),
      cancelEdit: () => this.setState({ editing: false }),
      saveEdit: () => {
        const edits = { ...this.state.edits, [s.idx]: { title: this.state.draftTitle, body: this.state.draftBody } };
        try { localStorage.setItem(this.EDITKEY, JSON.stringify(edits)); } catch(e) {}
        this.setState({ edits, editing: false });
      },
      resetEdit: () => {
        const edits = { ...this.state.edits };
        delete edits[s.idx];
        try { localStorage.setItem(this.EDITKEY, JSON.stringify(edits)); } catch(e) {}
        this.setState({ edits, editing: false });
      },
      onTitleChange: (e) => this.setState({ draftTitle: e.target.value }),
      onBodyChange: (e) => this.setState({ draftBody: e.target.value }),
      vizEl: React.createElement('div', { key: s.idx, dangerouslySetInnerHTML: { __html: p.viz } }),
      seenCount: s.pos + 1, total: s.data.length,
      progressPct: (((s.pos + 1) / s.data.length) * 100).toFixed(1) + '%',
      goNext: () => this.next(), goBack: () => this.back()
    };
  }
}
</script>
</body>
</html>
